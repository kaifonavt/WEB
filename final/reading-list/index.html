<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MULTIVERSE ARCHIVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg bg-body-tertiary shadow sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand p-2" href="../">MULTIVERSE<br>ARCHIVE</a>
        <div class="d-flex align-items-center ms-auto order-lg-last p-2">
            <button id="themeToggle" class="btn btn-link nav-link px-2 text-body text-decoration-none me-2" aria-label="Toggle theme">
                <i id="themeIcon" class="bi bi-moon-fill fs-5"></i>
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainnavbar" aria-controls="mainnavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse justify-content-end" id="mainnavbar">
            <ul class="navbar-nav m-1">
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../marvel">Marvel</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../dc">DC</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../newbies">Newbies</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../club">Club</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link active" aria-current="page" href="../reading-list">Reading List
                    <span id="nav-reading-count" class="badge bg-danger rounded-0 ms-1">0</span></a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container-fluid px-4 my-5">
    <section class="border p-4 bg-body-tertiary">
        <div class="d-flex flex-wrap align-items-center justify-content-between border-bottom pb-3 mb-4 gap-2">
            <div class="d-flex align-items-center gap-2">
                <h1 class="fw-bold text-uppercase m-0 display-6">My Reading List</h1>
                <span id="reading-list-count" class="badge bg-dark rounded-0 fs-6">0</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="./" class="btn btn-outline btn-sm rounded-0 fw-bold">
                    <i class="bi bi-arrow-left me-1"></i>Back to Comics
                </a>
                <button id="clear-list-btn" type="button" class="btn btn-outline-danger btn-sm rounded-0 fw-bold d-none">
                    Clear All
                </button>
            </div>
        </div>
        <div class="mb-4">
            <div class="d-flex justify-content-between small fw-bold text-uppercase mb-1">
                <span>Reading Progress</span>
                <span id="reading-progress-text">0 / 0 Read (0%)</span>
            </div>
            <div class="progress rounded-0 border" role="progressbar" aria-label="Reading list progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div id="reading-progress-bar" class="progress-bar bg-success fw-bold" style="width: 0%;">0%</div>
            </div>
        </div>
        <div id="reading-list-items" class="list-group rounded-0"></div>
    </section>
</main>
<footer class="bg-body-tertiary py-4 border-top mt-auto">
    <div class="container text-center text-muted">
        &copy; 2026 Multiverse Archive. No rights reserved.</br>
        Pictures are associated with Warner Bros. And Disney
    </div>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="../script/comics-card.js" defer></script>
<script src="../script/reading-list.js" defer></script>
<script src="../script/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
