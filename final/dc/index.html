<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MULTIVERSE ARCHIVE - DC </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary shadow sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand p-2" href="../">MULTIVERSE<br>ARCHIVE</a>
        <div class="d-flex align-items-center ms-auto order-lg-last p-2">
            <button id="themeToggle" class="btn btn-link nav-link px-2 text-body text-decoration-none me-2" aria-label="Toggle theme">
                <i id="themeIcon" class="bi bi-moon-fill fs-5"></i>
            </button>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainnavbar" aria-controls="mainnavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse justify-content-end" id="mainnavbar">
            <ul class="navbar-nav m-1">
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../marvel">Marvel</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../dc">DC</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../newbies">Newbies</a></li>
                <li class="nav-item p-1 m-1"><a class="nav-link" href="../club">Club</a></li>
            </ul>
        </div>
    </div>
</nav>
<main>
    <section>
        <div class="row g-0 border border-2">
            <div class="col-12 col-lg-5 bg-primary text-white p-md-5 d-flex flex-column align-items-start px-4 py-4">
                <span class=" d-inline-block border border-white px-2 py-1 fw-bold">
                    DC
                </span>
                <h1 class="display-4 fw-bold mt-3 mb-0">
                    MULTIVERSE<br>
                    OF HEROES
                </h1>
            </div>
            <div class="col-12 col-lg-7 p-3">
                <p class="mt-3">
                    add text here plz
                </p>
            </div>
        </div>
    </section>
    <section>
            <div class="container-fluid px-4 my-4">
                <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
                    <div>
                        <h2 class="fw-bold m-0">DC Heroes.</h2>
                        <p>Every can be a hero.</p>
                    </div>
                    <a href="#" class="text-danger fw-bold text-decoration-none">Open</a>
                </div>
                <p id="heroes-status" role="status">loading…</p>
                <div id="heroes-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xxl-5 flex-nowrap overflow-x-auto pb-4 g-3"></div>
            </div>
        </section>
    <template id="hero-template">
        <div class="col">
            <div class="card h-100 border-secondary p-3">
                <div class="ratio ratio-1x1 mb-3 border rounded overflow-hidden">
                    <img class="w-100 h-100 object-fit-cover" loading="lazy" alt="">
                </div>
                <div class="card-body p-0 d-flex flex-column">
                    <h3 class="fw-bold m-0 fs-4" data-field="name"></h3>
                    <p class="text-primary-emphasis small fw-bold mb-2" data-field="realName"></p>
                    <p class="card-text mb-3" data-field="description"></p>
                    <div class="d-flex flex-wrap gap-1 mb-3 mt-auto" data-field="tags"></div>
                    <a class="btn btn-outline-primary w-100 fw-bold" data-field="link"></a>
                </div>
            </div>
        </div>
    </template>
    <section class="container-fluid px-4 py-4">

    <section class="container-fluid px-4 py-4">
        <!-- TODO: Add Hero card generation through hero-card.js style though bootstrap even if looks bad, use marvel page as refernece (Zhalgas)  -->
    </section>
    <section class="container-fluid px-4 py-4">
        <!-- TODO: comics-card (Artur) -->
    </section>
</main>
<script src="../script/hero-card.js" defer></script>
<script src="../script/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
