<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Task 3 - Reserve a table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container" style="max-width: 500px;">
    <div class="card shadow border-0 p-4 rounded-4">
        <h2 class="mb-4 text-center fw-bold">Reserve a table</h2>

        <form action="#" method="POST">
            <div class="mb-3">
                <label class="form-label" for="name">Your name</label>
                <input class="form-control" id="name" name="name" placeholder="Your Name" required type="text">
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" placeholder="name@example.com" required
                       type="email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" id="phone" name="phone" placeholder="+7 701 228 42 67" required type="tel">
            </div>
            <div class="mb-3">
                <label class="form-label" for="guests">Guests</label>
                <input class="form-control" id="guests" max="10" min="1" name="guests" required type="number" value="2">
            </div>
            <div class="mb-3">
                <label class="form-label" for="date">Date</label>
                <input class="form-control" id="date" name="date" required type="date">
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Seating</label>
                <div class="form-check form-check-inline">
                    <input checked class="form-check-input" id="seating-inside" name="seating" required
                           type="radio" value="Inside">
                    <label class="form-check-label" for="seating-inside">Inside</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" id="seating-terrace" name="seating" required type="radio"
                           value="Terrace">
                    <label class="form-check-label" for="seating-terrace">Terrace</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="meal">Meal</label>
                <select class="form-select" id="meal" name="meal" required>
                    <option disabled selected value="">Select meal time...</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="comments">Comments</label>
                <textarea class="form-control" id="comments" name="comments" placeholder="Special requests..."
                          rows="3"></textarea>
            </div>
            <div class="mb-4 form-check">
                <input class="form-check-input" id="terms" name="terms" required type="checkbox">
                <label class="form-check-label" for="terms">I agree to the terms</label>
            </div>
            <button class="btn btn-primary w-100 py-2 rounded-3 fw-bold" type="submit">Reserve</button>
        </form>
    </div>
</div>
</body>
</html>
