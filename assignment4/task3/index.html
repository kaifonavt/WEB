<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Reserve a table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container" style="max-width: 500px;">
    <div class="card shadow border-0 p-4 rounded-4">
        <h2 class="mb-4 text-center fw-bold">Reserve a table</h2>

        <form action="#" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Your name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Your Name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 701 228 42 67" required>
            </div>
            <div class="mb-3">
                <label for="guests" class="form-label">Guests</label>
                <input type="number" class="form-control" id="guests" name="guests" min="1" max="10" value="2" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Seating</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="seating" id="seating-inside" value="Inside" checked required>
                    <label class="form-check-label" for="seating-inside">Inside</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="seating" id="seating-terrace" value="Terrace" required>
                    <label class="form-check-label" for="seating-terrace">Terrace</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="meal" class="form-label">Meal</label>
                <select class="form-select" id="meal" name="meal" required>
                    <option value="" disabled selected>Select meal time...</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="comments" class="form-label">Comments</label>
                <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Special requests..."></textarea>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">I agree to the terms</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">Reserve</button>
        </form>
    </div>
</div>
</body>
</html>
