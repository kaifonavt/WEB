<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Task 1 - Book a train ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light py-4 py-md-5">
<div class="container my-auto">
    <div class="card ticket-card border-0 shadow-lg mx-auto">
        <div class="ticket-header p-4">
            <h1 class="h3 fw-bold text-white mb-0">Book a train ticket</h1>
        </div>
        <div class="card-body p-4 p-md-5">
            <form action="#" method="GET">
                <div class="mb-4">
                    <div aria-label="Trip type" class="btn-group trip-toggle p-1 bg-light rounded-pill" role="group">
                        <input checked class="btn-check" id="oneWay" name="tripType" type="radio">
                        <label class="btn btn-pill-toggle rounded-pill px-4 fw-medium" for="oneWay">One way</label>

                        <input class="btn-check" id="roundTrip" name="tripType" type="radio">
                        <label class="btn btn-pill-toggle rounded-pill px-4 fw-medium" for="roundTrip">Round
                            trip</label>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="fromInput" name="from"
                                   placeholder="From" required type="text" value="Astana">
                            <label class="text-secondary" for="fromInput">From</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="toInput" name="to" placeholder="To"
                                   required type="text" value="Almaty">
                            <label class="text-secondary" for="toInput">To</label>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="departureInput" name="departure"
                                   required type="date">
                            <label class="text-secondary" for="departureInput">Departure</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="returnInput" name="return"
                                   type="date">
                            <label class="text-secondary" for="returnInput">Return</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="form-floating">
                            <select class="form-select rounded-4 bg-light border-0" id="passengersSelect"
                                    name="passengers" required>
                                <option selected value="1">1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                            </select>
                            <label class="text-secondary" for="passengersSelect">Passengers</label>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark mb-2">Carriage class</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" id="seatClass" name="carriageClass" required
                                   type="radio" value="Seat">
                            <label class="form-check-label text-secondary" for="seatClass">Seat</label>
                        </div>
                        <div class="form-check">
                            <input checked class="form-check-input" id="coupeClass" name="carriageClass"
                                   required type="radio" value="Coupé">
                            <label class="form-check-label text-secondary" for="coupeClass">Coupé</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" id="sleeperClass" name="carriageClass" required
                                   type="radio" value="Sleeper">
                            <label class="form-check-label text-secondary" for="sleeperClass">Sleeper</label>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="phoneInput" name="phone"
                                   placeholder="Phone" required type="tel" value="+7 701 234 56 78">
                            <label class="text-secondary" for="phoneInput">Phone</label>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control rounded-4 bg-light border-0" id="emailInput" name="email"
                                   placeholder="Email" required type="email" value="name@example.com">
                            <label class="text-secondary" for="emailInput">Email</label>
                        </div>
                    </div>
                </div>
                <div class="mb-4">
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" id="smsSwitch" name="sendSms" role="switch" type="checkbox">
                        <label class="form-check-label text-secondary ms-1" for="smsSwitch">Also send the ticket by
                            SMS</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" id="rulesCheck" name="agreeRules" required type="checkbox">
                        <label class="form-check-label text-secondary" for="rulesCheck">I agree with the carriage
                            rules</label>
                    </div>
                </div>
                <div class="d-flex flex-column flex-md-row justify-content-md-end gap-2 mt-4">
                    <button class="btn btn-find rounded-pill px-4 py-2 order-1 order-md-2 fw-semibold" type="submit">
                        Find trains
                    </button>
                    <button class="btn btn-clear rounded-pill px-4 py-2 order-2 order-md-1 fw-semibold" type="reset">
                        Clear
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
</body>
</html>
