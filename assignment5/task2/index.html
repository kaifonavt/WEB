<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kanban Board</title>
    <style>
        .board {
            display: flex;
            gap: 20px;
        }

        .column {
            border: 1px solid #ccc;
            padding: 10px;
            width: 200px;
            min-height: 300px;
        }

        .card {
            border: 1px solid #333;
            margin-bottom: 10px;
            padding: 10px;
            background: #f9f9f9;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
    <script defer src="script.js"></script>
</head>
<body>
<input id="search-input" placeholder="Search by tag..." type="text">
<p class="error" id="board-message"></p>
<div class="board" id="kanban-board">
    <div class="column" data-status="todo">
        <h3>To Do</h3>
        <div class="cards-container"></div>
    </div>
    <div class="column" data-status="in-progress">
        <h3>In Progress (<span class="progress-count">0</span>/3)</h3>
        <div class="cards-container"></div>
    </div>
    <div class="column" data-status="done">
        <h3>Done</h3>
        <div class="cards-container"></div>
    </div>
</div>
</body>
</html>
