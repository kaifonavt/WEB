<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher or Lower</title>
    <script defer src="script.js"></script>
</head>
<body>
<div id="game-container">
    <h1>Higher or Lower</h1>
    <div class="stats">
        <p>Lives: <span id="lives">3</span> | Streak: <span id="streak">0</span> | Best Streak: <span
                id="best-streak">0</span></p>
    </div>
    <h2 id="current-value">Current Number: <span></span></h2>
    <p id="message">Make your choice!</p>
    <div class="controls">
        <button id="btn-higher">Higher</button>
        <button id="btn-lower">Lower</button>
        <button id="btn-restart" style="display: none;">Restart Game</button>
    </div>
</div>
</body>
</html>
